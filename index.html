<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hacker Terminal</title>

<style>
  body {
    margin: 0;
    background: black;
    color: #00ff88;
    font-family: monospace;
  }

  .top {
    padding: 10px;
    border-bottom: 1px solid #00ff88;
    text-align: center;
  }

  #screen {
    height: 80vh;
    overflow-y: auto;
    padding: 10px;
  }

  .line {
    margin: 5px 0;
  }

  .user {
    color: white;
  }

  .bot {
    color: #00ff88;
  }

  .inputBox {
    display: flex;
    border-top: 1px solid #00ff88;
  }

  input {
    flex: 1;
    background: black;
    border: none;
    color: #00ff88;
    padding: 15px;
    outline: none;
    font-family: monospace;
  }

  button {
    background: #00ff88;
    border: none;
    padding: 15px;
    cursor: pointer;
    font-weight: bold;
  }
</style>
</head>

<body>

<div class="top">⚡ SYSTEM TERMINAL v3.0 ⚡</div>

<div id="screen"></div>

<div class="inputBox">
  <input id="cmd" placeholder="type command..." />
  <button onclick="send()">RUN</button>
</div>

<script>
const API = "https://chanfana-openapi-template.talah2026-2.workers.dev";

const screen = document.getElementById("screen");

function log(text, type) {
  const div = document.createElement("div");
  div.className = "line " + type;
  div.innerText = text;
  screen.appendChild(div);
  screen.scrollTop = screen.scrollHeight;
}

async function send() {
  const input = document.getElementById("cmd");
  const text = input.value;
  if (!text) return;

  log("> " + text, "user");
  input.value = "";

  log("processing...", "bot");

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();

    document.querySelectorAll(".bot").forEach(e => {
      if (e.innerText === "processing...") e.remove();
    });

    log(data.result, "bot");

  } catch (err) {
    log("connection failed", "bot");
  }
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});
</script>

</body>
</html>
